<!-- ヤフオク検索結果ページの構造を模したテスト用 HTML（実ページから必要部分だけを再現） -->
<html><body>
<ul class="Products__items">
  <li class="Product">
    <div class="Product__image">
      <a class="Product__imageLink" href="https://auctions.yahoo.co.jp/jp/auction/x1234567890">
        <img class="Product__imageData" src="https://auc-pctr.c.yimg.jp/i/sample1.jpg" alt="">
      </a>
    </div>
    <div class="Product__detail">
      <h3 class="Product__title">
        <a class="Product__titleLink" href="https://auctions.yahoo.co.jp/jp/auction/x1234567890"
           data-auction-id="x1234567890" data-auction-title="70s Levi's 501 66前期 W33 シングル"
           data-auction-price="38000" data-auction-img="https://auc-pctr.c.yimg.jp/i/sample1.jpg">
          70s Levi's 501 66前期 W33 シングル
        </a>
      </h3>
      <div class="Product__price"><span class="Product__priceValue">38,000円</span></div>
      <span class="Product__bid">3</span>
      <span class="Product__time">2日</span>
    </div>
  </li>
  <li class="Product">
    <div class="Product__detail">
      <h3 class="Product__title">
        <a class="Product__titleLink" href="https://auctions.yahoo.co.jp/jp/auction/k987654321">
          LVC 501 66モデル 復刻
        </a>
      </h3>
      <div class="Product__price"><span class="Product__priceValue">12,800円</span></div>
      <img src="https://auc-pctr.c.yimg.jp/i/sample2.jpg">
    </div>
  </li>
  <li class="Product"><div>広告枠などリンクの無いカード</div></li>
</ul>
</body></html>
